<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0a14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Shadow Runner: Pixel Adventure — an HTML5 platformer for Android." />
  <title>Shadow Runner: Pixel Adventure</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Orientation notice shown in portrait on phones -->
  <div id="rotate-notice">
    <div class="rotate-card">
      <div class="rotate-icon">↻</div>
      <h1>چرخش دستگاه</h1>
      <p>برای بهترین تجربه، گوشی را به حالت افقی (Landscape) بچرخانید.</p>
      <p class="en">Rotate your device for the best experience.</p>
    </div>
  </div>

  <!-- Loading splash -->
  <div id="splash">
    <div class="splash-inner">
      <h1>SHADOW RUNNER</h1>
      <h2>Pixel Adventure</h2>
      <div class="bar"><div id="splash-bar"></div></div>
      <p id="splash-text">در حال بارگذاری…</p>
    </div>
  </div>

  <!-- Game canvas container -->
  <div id="game-container"></div>

  <!-- Touch controls overlay -->
  <div id="touch-controls" class="hidden">
    <div class="dpad">
      <button id="btn-left" class="tc-btn" aria-label="Left">◀</button>
      <button id="btn-right" class="tc-btn" aria-label="Right">▶</button>
    </div>
    <div class="actions">
      <button id="btn-jump" class="tc-btn action" aria-label="Jump">JUMP</button>
      <button id="btn-dash" class="tc-btn action" aria-label="Dash">DASH</button>
      <button id="btn-pause" class="tc-btn pause" aria-label="Pause">II</button>
    </div>
  </div>

  <!-- Phaser + game -->
  <script src="./vendor/phaser.min.js"></script>
  <script src="./src/main.js" type="module"></script>
</body>
</html>
